{% extends "base.html" %}{% block content %}
<h2>Events {% if cat %}({{cat}}){% endif %}</h2>
<div class="mb-2"><a href="/events" class="btn btn-sm btn-secondary">All</a>
<a href="/events?category=tech" class="btn btn-sm btn-info">Tech</a>
<a href="/events?category=cultural" class="btn btn-sm btn-warning">Cultural</a>
<a href="/events?category=sports" class="btn btn-sm btn-success">Sports</a>
<a href="/events?category=workshop" class="btn btn-sm btn-dark">Workshop</a></div>
<div class="row">{% for e in events %}
<div class="col-md-4"><div class="card mb-3"><div class="card-body">
<h5>{{e.title}}</h5><small>{{e.date}} | {{e.venue}} | Seats: {{e.seats_left}}</small>
<p>{{e.description[:100]}}</p><a href="/event/{{e.id}}" class="btn btn-sm btn-primary">Register</a>
</div></div></div>{% endfor %}</div>{% endblock %}
